<main>
  <h1>{{ title() }}</h1>
  <h2>Fiches de personnages</h2>
  <ul class="character-list">
    @for (char of characters(); track char.id) {
      <li>
        <a class="character-card" [routerLink]="['/demonlord', char.id]">
          {{ char.name }}
          @if (char.nickname) {
            <span>{{ char.nickname }}</span>
          }
        </a>
      </li>
    }
  </ul>
</main>
