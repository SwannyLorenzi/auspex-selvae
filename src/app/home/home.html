<style>
    :host {
      display: block;
      min-height: 100dvh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
        "Segoe UI Symbol";
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    main {
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 3.125rem;
      color: oklch(19.37% 0.006 300.98);
      font-weight: 500;
      line-height: 100%;
      letter-spacing: -0.125rem;
      margin: 0 0 2rem;
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
        "Segoe UI Symbol";
      text-align: center;
    }

    h2 {
      font-size: 1.5rem;
      color: oklch(19.37% 0.006 300.98);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .character-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .character-card {
      display: block;
      padding: 1.5rem 2rem;
      background: oklch(53.18% 0.28 296.97 / 0.1);
      border: 1px solid oklch(53.18% 0.28 296.97 / 0.3);
      border-radius: 0.5rem;
      text-decoration: none;
      color: oklch(47.66% 0.246 305.88);
      font-weight: 500;
      font-size: 1.1rem;
      transition: background 0.3s ease, border-color 0.3s ease;
      text-align: center;
    }

    .character-card:hover {
      background: oklch(53.18% 0.28 296.97 / 0.2);
      border-color: oklch(47.66% 0.246 305.88);
    }

    .character-card span {
      display: block;
      font-size: 0.85rem;
      color: oklch(36.98% 0.014 302.71);
      font-weight: 400;
      margin-top: 0.25rem;
    }
</style>

<main>
    <h1>{{ title() }}</h1>
    <h2>Fiches de personnages</h2>
    <ul class="character-list">
      @for (char of characters; track char.path) {
        <li>
          <a class="character-card" [routerLink]="char.path">
            {{ char.name }}
            <span>{{ char.description }}</span>
          </a>
        </li>
      }
    </ul>
</main>
