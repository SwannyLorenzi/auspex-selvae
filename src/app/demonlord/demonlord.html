<header>
  <a routerLink="/" class="header-btn" aria-label="Retour à l'accueil">
    <svg lucideArrowLeft></svg>
  </a>
  <div class="title-group">
    <h1>Ombre du Seigneur Démon</h1>
    <h2 class="char-title">
      {{ character()!.name }}
      @if (character()!.nickname) {
        <span class="char-nick">- {{ character()!.nickname }}</span>
      }
    </h2>
  </div>
  <button class="header-btn" (click)="confirmReset()" aria-label="Reset character state">
    <svg lucideRotateCcw></svg>
  </button>
</header>
<main>
  <div class="row">
    <section>
      <app-character [character]="character()" />
    </section>
    <section>
      <app-progression [progression]="character()!.progression" />
    </section>
    <section>
      <app-professions [professions]="character()!.professions" />
    </section>
  </div>
  <section>
    <app-characteristics
      [mainAttributes]="character()!.mainAttributes"
      [derivedAttributes]="character()!.derivedAttributes"
      [characterId]="character()!.id"
      [defense]="character()!.defense ?? null" />
  </section>
  <section>
    <app-afflictions
      [immunities]="character()!.immunities"
      [activeKeys]="character()!.activeAfflictions"
      (toggled)="characterService.updateActiveAfflictions(characterId(), $event)" />
  </section>
  <section>
    <app-talents
      [immunities]="character()!.immunities"
      [talents]="character()!.talents" />
  </section>
  @if (character()!.magic.spells.length > 0) {
    <section>
      <app-magic
        [magic]="character()!.magic"
        [characterId]="character()!.id" />
    </section>
  }
  @if (character()!.progression.expert === 'Grand Brasseur' || character()!.potions.length > 0) {
    <section>
      <app-master-brewer [potions]="character()!.potions" />
    </section>
  }
  <section>
    <app-money
      [characterId]="character()!.id"
      [money]="character()!.money" />
  </section>
  <section>
    <app-equipment
      [character]="character()!"
      [equipment]="character()!.equipment" />
  </section>
</main>
