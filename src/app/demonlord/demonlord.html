<header>
  <h1>Ombre du Seigneur Démon</h1>
  <h2>{{ character.name }}</h2>
  <a routerLink="/" aria-label="Retour à l'accueil">
    <svg
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <path
        d="M5 7.5L10 12.5L15 7.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </a>
</header>
<main>
  <div class="row">
    <section>
      <app-character [character]="character" />
    </section>
    <section>
      <app-progression [progression]="character.progression" />
    </section>
    <section>
      <app-professions [professions]="character.professions" />
    </section>
  </div>
  <section>
    <app-characteristics
      [mainAttributes]="character.mainAttributes"
      [derivedAttributes]="character.derivedAttributes" />
  </section>
  <section>
    <app-talents
      [immunities]="character.immunities"
      [talents]="character.talents" />
  </section>
  <section>
    <app-magic [magic]="character.magic" />
  </section>
  <section>
    <app-master-brewer [potions]="character.potions" />
  </section>
  <section>
    <app-equipment
      [currency]="character.currency"
      [equipment]="character.equipment" />
  </section>
</main>
