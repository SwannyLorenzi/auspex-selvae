<div class="magie-header">
  <h2>Magie</h2>
  <span>Puissance {{ magic().power }}</span>
  <button
    type="button"
    class="reset-button"
    (click)="resetAllUses()"
    aria-label="Réinitialiser toutes les utilisations de sorts">
    <span aria-hidden="true">↺</span> Réinitialiser
  </button>
</div>

<div class="magie-content">
  <div class="spell-list">
    @for (spell of magic().spells; track spell.name) {
      <app-spell-card [spell]="spell" [power]="magic().power" />
    }
  </div>
</div>
