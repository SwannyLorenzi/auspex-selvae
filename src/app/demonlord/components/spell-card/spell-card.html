<button
  type="button"
  class="spell-card"
  [class.expanded]="isExpanded()"
  (click)="toggleExpanded()"
  [attr.aria-expanded]="isExpanded()"
  [attr.aria-label]="spell().name + ' - ' + (isExpanded() ? 'Replier' : 'Déplier')"
>
  <div class="spell-header">
    <span class="spell-name">{{ spell().name }}</span>
    <span class="spell-meta">
      <span class="spell-level">Niv. {{ spell().level }}</span>
      @if (spell().uses > 0) {
        <span class="spell-uses">{{ spell().uses }} utilisation{{ spell().uses > 1 ? 's' : '' }}</span>
      }
    </span>
  </div>
  <div class="spell-tradition">{{ spell().tradition }}</div>

  @if (isExpanded()) {
    <div class="spell-details">
      @if (spell().targetRange) {
        <div class="detail-block">
          <strong>Cible / Portée :</strong> {{ spell().targetRange }}
        </div>
      }
      @if (spell().duration) {
        <div class="detail-block">
          <strong>Durée :</strong> {{ spell().duration }}
        </div>
      }
      @if (spell().effects) {
        <div class="detail-block">
          <strong>Effets :</strong> {{ spell().effects }}
        </div>
      }
      @if (spell().bonus20Plus) {
        <div class="detail-block bonus-block">
          <strong>Bonus 20+ :</strong> {{ spell().bonus20Plus }}
        </div>
      }
    </div>
  }
</button>
