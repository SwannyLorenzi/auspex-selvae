<button
  type="button"
  class="spell-card"
  [class.expanded]="isExpanded()"
  (click)="toggleExpanded()"
  [attr.aria-expanded]="isExpanded()"
  [attr.aria-label]="
    spell().name + ' - ' + (isExpanded() ? 'Replier' : 'Déplier')
  ">
  <div class="spell-header">
    <div class="spell-name-row">
      <span class="spell-name">{{ spell().name }}</span>
      <span class="spell-uses">
        @for (_ of [].constructor(maxUses()); track $index) {
          <span
            class="tick"
            [class.used]="spell().currentUses > $index"
            (click)="spendUse(); $event.stopPropagation()"
            [attr.aria-label]="
              $any(spell().currentUses > $index)
                ? 'Utilisation déjà dépensée'
                : 'Dépenser une utilisation'
            "
            role="button"
            tabindex="0"
            >●</span
          >
        }
      </span>
    </div>
    <span class="spell-meta">
      <span class="spell-level"
        >{{ spell().tradition.name }} Niv. {{ spell().level }}</span
      >
    </span>
  </div>

  @if (isExpanded()) {
    <div class="spell-details">
      @if (spell().target) {
        <div class="detail-block">
          <strong>Cible / Portée :</strong> {{ spell().target }}
        </div>
      }
      @if (spell().duration) {
        <div class="detail-block">
          <strong>Durée :</strong> {{ spell().duration }}
        </div>
      }
      @if (spell().effect) {
        <div class="detail-block">
          <strong>Effets :</strong> {{ spell().effect }}
        </div>
      }
      @if (spell().bonus20Plus) {
        <div class="detail-block bonus-block">
          <strong>Bonus 20+ :</strong> {{ spell().bonus20Plus }}
        </div>
      }
    </div>
  }
</button>
