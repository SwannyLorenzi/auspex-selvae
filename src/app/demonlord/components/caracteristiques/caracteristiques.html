<h2>Caractéristiques</h2>

<div class="caracteristiques-content">
      <div>
          <h3>Principales</h3>
          <div class="attributes-grid">
          @for (attr of mainAttributes; track attr.name) {
              <app-attribute-card [attribute]="attr" />
          }
          </div>
      </div>

      <div>
          <h3>Dérivées</h3>
          <app-derived-attributes [attributes]="derivedAttributes" />
      </div>
</div>
