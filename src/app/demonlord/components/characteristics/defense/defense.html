<div class="defense-section">
  <h3>Défense</h3>
  <div class="defense-grid">
    <div class="defense-card">
      <div class="defense-label">Base</div>
      <div class="defense-value">{{ defense().base }}</div>
    </div>
    <div class="defense-card">
      <div class="defense-label">Avec armure</div>
      <div class="defense-value">{{ defense().withArmor }}</div>
    </div>
    <div class="defense-card">
      <div class="defense-label">Avec armure et bouclier</div>
      <div class="defense-value">{{ defense().withArmorAndShield }}</div>
    </div>
  </div>
</div>
