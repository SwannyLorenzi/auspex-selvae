<div class="pentagram-container" [class.ko]="isKO()">
  <svg class="pentagram-svg" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pentagramme des caractéristiques du personnage">
    <defs>
      <!-- Main vertex circles (R=40, arcR=35) -->
      <path id="arc-force" d="M 162 140 A 35 35 0 0 1 232 140" />
      <path id="arc-intellect" d="M 468 140 A 35 35 0 0 1 538 140" />
      <path id="arc-agilite" d="M 68 430 A 35 35 0 0 1 138 430" />
      <path id="arc-volonte" d="M 562 430 A 35 35 0 0 1 632 430" />
      <path id="arc-sante" d="M 315 610 A 35 35 0 0 1 385 610" />
      <!-- Secondary circles (R=25, arcR=20) -->
      <path id="arc-gabarit" d="M 177 75 A 20 20 0 0 1 217 75" />
      <path id="arc-perception" d="M 483 75 A 20 20 0 0 1 523 75" />
      <path id="arc-vitesse" d="M 83 365 A 20 20 0 0 1 123 365" />
      <path id="arc-folie" d="M 577 365 A 20 20 0 0 1 617 365" />
      <path id="arc-soin" d="M 330 545 A 20 20 0 0 1 370 545" />
      <!-- Special circles -->
      <path id="arc-defense" d="M 150 555 A 20 20 0 0 1 190 555" />
      <path id="arc-corruption" d="M 510 555 A 20 20 0 0 1 550 555" />
      <path id="arc-degats" d="M 280 350 A 70 70 0 0 1 420 350" />
    </defs>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- LAYER 1: Decorative elements (back)            -->
    <!-- ═══════════════════════════════════════════════ -->

    <!-- Outer decorative circle: r=300 (touches main vertex circles) -->
    <circle cx="350" cy="350" r="300" fill="none" stroke="rgba(160,32,32,0.25)" stroke-width="2"/>

    <!-- Inner decorative circle: r=220 (inside pentagram) -->
    <circle cx="350" cy="350" r="220" fill="none" stroke="rgba(160,32,32,0.4)" stroke-width="3"/>

    <!-- Pentagon outline (connecting all 5 vertices) -->
    <polygon
      points="197,140 503,140 597,430 350,610 103,430"
      fill="rgba(160,32,32,0.04)"
      stroke="none"
    />

    <!-- Inverted pentagram star -->
    <!-- Intellect(503,140) → Santé(350,610) → Force(197,140) → Volonté(597,430) → Agilité(103,430) → Intellect -->
    <polyline
      points="503,140 350,610 197,140 597,430 103,430 503,140"
      fill="none"
      stroke="rgba(160,32,32,0.6)"
      stroke-width="2"
    />

    <!-- ═══════════════════════════════════════════════ -->
    <!-- LAYER 2: Stat circles + values (middle)        -->
    <!-- ═══════════════════════════════════════════════ -->

    <!-- Main vertex circles (R=40) -->
    <!-- Force -->
    <g class="stat-circle main" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.7)' : 'rgba(184,168,136,0.7)'" cx="197" cy="140" r="40" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="197" y="135" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700">{{ vertices()[0].value }}</text>
      @if (vertices()[0].bonus) {
        <text [attr.fill]="isKO() ? '#a02020' : '#c9b47a'" x="197" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">{{ vertices()[0].bonus }}</text>
      }
    </g>

    <!-- Intellect -->
    <g class="stat-circle main" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.7)' : 'rgba(184,168,136,0.7)'" cx="503" cy="140" r="40" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="503" y="135" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700">{{ vertices()[1].value }}</text>
      @if (vertices()[1].bonus) {
        <text [attr.fill]="isKO() ? '#a02020' : '#c9b47a'" x="503" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">{{ vertices()[1].bonus }}</text>
      }
    </g>

    <!-- Agilité -->
    <g class="stat-circle main" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.7)' : 'rgba(184,168,136,0.7)'" cx="103" cy="430" r="40" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="103" y="425" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700">{{ vertices()[2].value }}</text>
      @if (vertices()[2].bonus) {
        <text [attr.fill]="isKO() ? '#a02020' : '#c9b47a'" x="103" y="448" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">{{ vertices()[2].bonus }}</text>
      }
    </g>

    <!-- Volonté -->
    <g class="stat-circle main" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.7)' : 'rgba(184,168,136,0.7)'" cx="597" cy="430" r="40" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="597" y="425" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700">{{ vertices()[3].value }}</text>
      @if (vertices()[3].bonus) {
        <text [attr.fill]="isKO() ? '#a02020' : '#c9b47a'" x="597" y="448" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600">{{ vertices()[3].bonus }}</text>
      }
    </g>

    <!-- Santé -->
    <g class="stat-circle main" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.7)' : 'rgba(184,168,136,0.7)'" cx="350" cy="610" r="40" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="350" y="605" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700">{{ vertices()[4].value }}</text>
    </g>

    <!-- Secondary circles (R=25) -->
    <!-- Gabarit -->
    <g class="stat-circle secondary" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.35)' : 'rgba(184,168,136,0.35)'" cx="197" cy="75" r="25" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="197" y="75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700">{{ vertices()[0].secondary?.value ?? 0 }}</text>
    </g>

    <!-- Perception -->
    <g class="stat-circle secondary" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.35)' : 'rgba(184,168,136,0.35)'" cx="503" cy="75" r="25" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="503" y="75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700">{{ vertices()[1].secondary?.value ?? 0 }}</text>
      @if (vertices()[1].secondary?.bonus) {
        <text [attr.fill]="isKO() ? '#a02020' : '#c9b47a'" x="503" y="92" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600">{{ vertices()[1].secondary?.bonus }}</text>
      }
    </g>

    <!-- Vitesse -->
    <g class="stat-circle secondary" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.35)' : 'rgba(184,168,136,0.35)'" cx="103" cy="365" r="25" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="103" y="365" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700">{{ vertices()[2].secondary?.value ?? 0 }}</text>
    </g>

    <!-- Folie -->
    <g class="stat-circle secondary" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.35)' : 'rgba(184,168,136,0.35)'" cx="597" cy="365" r="25" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="597" y="365" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700">{{ vertices()[3].secondary?.value ?? 0 }}</text>
    </g>

    <!-- Guérison -->
    <g class="stat-circle secondary" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.35)' : 'rgba(184,168,136,0.35)'" cx="350" cy="545" r="25" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="350" y="545" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700">{{ vertices()[4].secondary?.value ?? 0 }}</text>
    </g>

    <!-- Special circles (R=20) -->
    <!-- Défense -->
    <g class="stat-circle secondary" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.35)' : 'rgba(184,168,136,0.35)'" cx="170" cy="555" r="20" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="170" y="555" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700">{{ data().defense }}</text>
    </g>

    <!-- Corruption -->
    <g class="stat-circle secondary" [class.ko]="isKO()">
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.35)' : 'rgba(184,168,136,0.35)'" cx="530" cy="555" r="20" stroke-width="2"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="530" y="555" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700">{{ data().corruption }}</text>
    </g>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- LAYER 3: Dégâts center circle + buttons       -->
    <!-- ═══════════════════════════════════════════════ -->

    <g class="stat-circle center" [class.ko]="isKO()">
      <!-- KO overlay: red tint applied via CSS filter -->
      <circle [attr.fill]="isKO() ? 'rgba(45,6,6,0.8)' : 'rgba(15,15,26,0.8)'" [attr.stroke]="isKO() ? 'rgba(160,32,32,0.7)' : 'rgba(184,168,136,0.7)'" cx="350" cy="350" r="70" stroke-width="3"/>
      <text [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" x="350" y="345" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700">{{ data().damage }}</text>
      <!-- Damage buttons -->
      <g class="damage-controls">
        <circle class="damage-btn add" cx="330" cy="395" r="14"
                [style.pointer-events]="isDamageAtMax() ? 'none' : 'auto'"
                [style.opacity]="isDamageAtMax() ? 0.35 : 1"
                (click)="!isDamageAtMax() && characterService.updateAttribute(characterId(), 'damage', data().damage + 1)"
                aria-label="Ajouter des dégâts" />
        <text class="damage-btn-text add" x="330" y="395" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" pointer-events="none">+</text>
        <circle class="damage-btn remove" cx="370" cy="395" r="14"
                [style.pointer-events]="isDamageAtZero() ? 'none' : 'auto'"
                [style.opacity]="isDamageAtZero() ? 0.35 : 1"
                (click)="!isDamageAtZero() && characterService.updateAttribute(characterId(), 'damage', data().damage - 1)"
                aria-label="Retirer des dégâts" />
        <text class="damage-btn-text remove" x="370" y="395" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" pointer-events="none">−</text>
      </g>
    </g>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- LAYER 4: Labels on curved paths (front)        -->
    <!-- ═══════════════════════════════════════════════ -->

    <g [attr.fill]="isKO() ? '#a02020' : '#e0d6c8'" font-size="11" font-weight="700" letter-spacing="0.05em">
      <!-- Main vertex labels -->
      <text><textPath href="#arc-force" startOffset="50%" text-anchor="middle">FORCE</textPath></text>
      <text><textPath href="#arc-intellect" startOffset="50%" text-anchor="middle">INTELLECT</textPath></text>
      <text><textPath href="#arc-agilite" startOffset="50%" text-anchor="middle">AGILITÉ</textPath></text>
      <text><textPath href="#arc-volonte" startOffset="50%" text-anchor="middle">VOLONTÉ</textPath></text>
      <text><textPath href="#arc-sante" startOffset="50%" text-anchor="middle">SANTÉ</textPath></text>
      <!-- Secondary labels -->
      <text font-size="9"><textPath href="#arc-gabarit" startOffset="50%" text-anchor="middle">GABARIT</textPath></text>
      <text font-size="9"><textPath href="#arc-perception" startOffset="50%" text-anchor="middle">PERCEPTION</textPath></text>
      <text font-size="9"><textPath href="#arc-vitesse" startOffset="50%" text-anchor="middle">VITESSE</textPath></text>
      <text font-size="9"><textPath href="#arc-folie" startOffset="50%" text-anchor="middle">FOLIE</textPath></text>
      <text font-size="9"><textPath href="#arc-soin" startOffset="50%" text-anchor="middle">GUÉRISON</textPath></text>
      <!-- Special labels -->
      <text font-size="9"><textPath href="#arc-defense" startOffset="50%" text-anchor="middle">DÉFENSE</textPath></text>
      <text font-size="9"><textPath href="#arc-corruption" startOffset="50%" text-anchor="middle">CORRUPTION</textPath></text>
      <!-- Dégâts label (larger circle) -->
      <text font-size="16"><textPath href="#arc-degats" startOffset="50%" text-anchor="middle">DÉGÂTS</textPath></text>
    </g>

  </svg>

  <!-- KO overlay: red tint for center circle logo (Dégâts) -->
  @if (isKO()) {
    <div class="ko-overlay" [style.background-image]="'url(./logo.webp)'"></div>
  }
</div>
