<h2>Talents</h2>

@if (immunities().length) {
  <h3>Immunités</h3>
  <ul class="immunity-list">
    @for (imm of immunities(); track imm) {
      <li class="immunity-tag">
        <span class="immunity-tag__emoji">{{ immunity(imm).emoji }}</span>
        <span class="immunity-tag__label">{{ immunity(imm).label }}</span>
      </li>
    }
  </ul>
}

<h3>Liste des talents</h3>
<ul>
  @for (talent of talents(); track talent) {
    <li>{{ talent }}</li>
  }
</ul>
