<h2>Talents</h2>

@for (talent of talents(); let last = $last; track talent.name) {
  <button
    type="button"
    class="talent-card"
    [class.last]="last"
    [class.expanded]="expanded() === talent.name"
    (click)="toggleExpanded(talent.name)"
    [attr.aria-expanded]="expanded() === talent.name"
    [attr.aria-label]="
      talent.name + ' - ' + (expanded() === talent.name ? 'Replier' : 'Déplier')
    ">
    <span class="talent-name">{{ talent.name }}</span>

    @if (expanded() === talent.name) {
      <div class="talent-description">
        {{ talent.description }}
        <div class="source-block">Source : {{ talent.source }}</div>
      </div>
    }
  </button>
}
