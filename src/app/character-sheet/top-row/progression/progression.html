<div class="card">
   <h2>Progression</h2>
   <div class="progression-list">
     <div class="prop">
       <span class="label">Niveau</span>
       <span class="value">{{ progression.level }}</span>
     </div>
     <div class="prop">
       <span class="label">Ascendance</span>
       <span class="value">{{ progression.ancestry }}</span>
     </div>
     <div class="prop">
       <span class="label">Apprenti</span>
       <span class="value">{{ progression.apprentice }}</span>
     </div>
     <div class="prop">
       <span class="label">Expert</span>
       <span class="value">{{ progression.expert }}</span>
     </div>
     @if (progression.master) {
       <div class="prop">
         <span class="label">Maître</span>
         <span class="value">{{ progression.master }}</span>
       </div>
     }
   </div>
</div>
